<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ellington CRM – Töölaud</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fa; color: #1d2939; }
header { background: #183b67; color: white; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header h1 { margin: 0; font-size: 22px; }
header button { background: white; color: #183b67; border: 0; padding: 10px 14px; border-radius: 7px; cursor: pointer; }
.layout { display: flex; min-height: calc(100vh - 70px); }
nav { width: 210px; background: white; padding: 20px 12px; border-right: 1px solid #e4e7ec; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 14px; border-radius: 8px; font-size: 15px; cursor: pointer; }
nav button.active { background: #e9f0f9; color: #183b67; font-weight: bold; }
main { flex: 1; padding: 30px; }
h2 { margin-top: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; }
.card { background: white; padding: 24px; border-radius: 12px; border: 1px solid #e4e7ec; }
.card strong { display: block; font-size: 28px; margin-top: 12px; }
.card p { margin: 0; color: #667085; }
#content { margin-top: 24px; }
@media (max-width: 650px) {
  .layout { display: block; }
  nav { width: 100%; display: flex; overflow-x: auto; padding: 8px; }
  nav button { white-space: nowrap; }
  main { padding: 18px; }
  header { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>Ellington CRM</h1>
  <div><span id="userName"></span> <button id="logout">Logi välja</button></div>
</header>
<div class="layout">
  <nav id="menu">
    <button class="active" data-page="dashboard">Töölaud</button>
    <button data-page="templates">Mallid</button>
    <button data-page="users">Kasutajad</button>
    <button data-page="budget">Eelarve</button>
  </nav>
  <main>
    <h2 id="pageTitle">Töölaud</h2>
    <div id="content">
      <div class="cards">
        <div class="card"><p>Kliendid</p><strong>—</strong></div>
        <div class="card"><p>Kontaktid</p><strong>—</strong></div>
        <div class="card"><p>Tegevused</p><strong>—</strong></div>
        <div class="card"><p>Müük</p><strong>—</strong></div>
      </div>
    </div>
  </main>
</div>
<script>
const titles = {dashboard:'Töölaud',templates:'Mallid',users:'Kasutajad',budget:'Eelarve'};
const content = document.getElementById('content');
const dashboardHTML = content.innerHTML;
async function init() {
  try {
    const response = await fetch('/api/me', {credentials:'same-origin'});
    if (!response.ok) { location.replace('/'); return; }
    const data = await response.json();
    const user = data.user;
    document.getElementById('userName').textContent = user.name;
    if (user.role !== 'admin') {
      document.querySelectorAll('[data-page="templates"],[data-page="users"],[data-page="budget"]').forEach(b => b.remove());
    }
  } catch { location.replace('/'); }
}
document.querySelectorAll('#menu button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    const page = button.dataset.page;
    document.getElementById('pageTitle').textContent = titles[page];
    if (page === 'dashboard') {
      content.innerHTML = dashboardHTML;
    } else {
      content.textContent = 'See osa valmib järgmistes etappides.';
    }
  });
});
document.getElementById('logout').addEventListener('click', async () => {
  const response = await fetch('/api/logout', {method:'POST',credentials:'same-origin'});
  if (response.ok) location.replace('/');
});
init();
</script>
</body>
</html>

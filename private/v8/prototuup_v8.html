let clientSearch = '';
let clientMatches = [];
let clientSearchTimer = null;

function clientResultsHTML(clients){
  return `<div class="stack">${clients.map(client=>`
    <section class="panel"
      role="button" tabindex="0"
      style="cursor:pointer"
      onclick="openClientById(${Number(client.id)})"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openClientById(${Number(client.id)})}">
      <div class="bar">
        <b>${esc(client.name)}</b>
        <span class="muted">›</span>
      </div>
    </section>`).join('') ||
    (clientSearch.trim() ? '<p class="muted">Kliente ei leitud.</p>' : '<p class="muted">Klientide nägemiseks sisesta ettevõtte nimi.</p>')}</div>`;
}

async function updateClientResults(){
  clearTimeout(clientSearchTimer);

  const target = $('clientResults');
  if(!target) return;

  if(!clientSearch.trim()){
    clientMatches = [];
    target.innerHTML = clientResultsHTML([]);
    return;
  }

  const query = clientSearch.trim();

  clientSearchTimer = setTimeout(async ()=>{
    try {
      const response = await fetch(
        '/api/clients?search=' + encodeURIComponent(query),
        { credentials: 'same-origin' }
      );

      if(!response.ok) throw new Error('HTTP ' + response.status);

      const result = await response.json();

      if(query !== clientSearch.trim()) return;

      clientMatches = result.clients || [];

      const current = $('clientResults');
      if(current) current.innerHTML = clientResultsHTML(clientMatches);
    } catch(error) {
      const current = $('clientResults');
      if(current) current.innerHTML =
        '<p class="muted">Otsing ei õnnestunud. Proovi uuesti.</p>';
    }
  }, 250);
}

function clientDetailHTML(result){
  const c = result.client;
  const contacts = result.contacts || [];
  const history = result.history || [];

  const field = (label, value) => `
    <div>
      <div class="muted">${esc(label)}</div>
      <div style="white-space:pre-wrap">${esc(value || '—')}</div>
    </div>`;

  const section = (title, content) => `
    <section class="panel">
      <h3>${esc(title)}</h3>
      ${content}
    </section>`;

  const contactHTML = contacts.length
    ? contacts.map(person => `
        <div style="margin-bottom:16px">
          <b>${esc(person.name)}</b>
          ${person.position
            ? `<div class="muted">${esc(person.position)}</div>`
            : ''}
          ${person.email
            ? `<div>${esc(person.email)}</div>`
            : ''}
          ${person.phone
            ? `<div>${esc(person.phone)}</div>`
            : ''}
        </div>`).join('')
    : '<p class="muted">Kontaktisikuid ei ole lisatud.</p>';

  const completedActivities = result.activityHistory || [];
  const completedHTML = completedActivities.map(item => `
    <div style="margin-bottom:16px;border-bottom:1px solid #ddd;padding-bottom:12px">
      <b>${esc(item.type)}</b> <span class="muted">· ${item.status === 'completed' ? (item.outcome==='cancelled'?'Kohtumine jäi ära':'Tehtud') : (item.completion_event_type==='completed_and_stopped'?'Tehtud; jälgimine lõpetatud':'Tegevus peatatud')}</span>
      <div class="muted">${esc(item.completed_at ? String(item.completed_at).replace('T',' ').slice(0,19) : 'Aeg teadmata')} · Tegija: ${esc(item.completed_by || 'Teadmata')}</div>
      ${item.outcome ? `<div><b>Tulemus:</b> ${esc(({done:'Tehtud',cancelled:'Jäi ära',postponed:'Edasi lükatud'})[item.outcome]||item.outcome)}</div>` : ''}
      ${item.purpose ? `<div><b>Eesmärk:</b> ${esc(item.purpose)}</div>` : ''}
      <div><b>Algne juhis:</b> <span style="white-space:pre-wrap">${esc(item.instructions || item.notes || '—')}</span></div>
      <div><b>Tegelik tulemus / kommentaar:</b> <span style="white-space:pre-wrap">${esc(item.result_comment || (item.has_completion_event ? 'Kommentaari ei salvestatud.' : 'Lõpetamise sündmus puudub.'))}</span></div>
    </div>`).join('');

  const replyHTML=(result.replyHistory||[]).map(r=>`<div class="divider"><b>Kliendi vastus käsitletud</b><div class="muted">${esc(r.created_at||'')} · ${esc(r.actor_name||'')}</div><div>${esc(({reviewed:'Vastus läbi vaadatud',planned:'Uus tegevus planeeritud',completed:'Tegevus lõpetatud',stopped:'Jälgimine lõpetatud'})[r.action]||r.action||'')}</div><p style="white-space:pre-wrap">${esc(r.note||'')}</p></div>`).join('');
  const historyHTML = completedHTML + replyHTML + (history.length
    ? history.map(item => `
        <div style="margin-bottom:12px">
          <b>${esc(item.activity_type)}</b>
          <div style="white-space:pre-wrap">
            ${esc(item.original_value || '—')}
          </div>
          <div class="muted">
            Allika veerg: ${esc(item.source_column)}
          </div>
        </div>`).join('')
    : (completedActivities.length ? '' : '<p class="muted">Varasemaid tegevusi ei ole.</p>'));

  return `
    <div class="stack">
      <div>
        <button onclick="crmBackToClients()">
          ← Tagasi otsingusse
        </button>
      </div>

      ${section('Kliendi andmed', `
        <h2>${esc(c.name)}</h2>
        <div class="stack">
          ${field('Liik', c.client_type)}
          ${field('Vastutaja', c.owner_name)}
          ${field('Follow-up’ide arv', String(c.followup_count ?? 0))}
          ${c.stop_reason ? field('Jälgimise lõpetamise põhjus', c.stop_reason) : ''}
        </div>
      `)}


      ${section('Eelarve', `<div id="clientBudgetPanel"><button onclick="v8BudgetOpen(${Number(c.id)})">Muuda eelarvet</button></div>`)}

      ${section('Tegevused', crmClientActivities(result))}

      ${section('Kontaktisikud', contactHTML)}

      ${section('Kliendi kommentaar', `
        <p style="white-space:pre-wrap">
          ${esc(c.client_comment || 'Kommentaar puudub.')}
        </p>
      `)}

      ${section('Meie kommentaar', `
        <p style="white-space:pre-wrap">
          ${esc(c.our_comment || 'Kommentaar puudub.')}
        </p>
      `)}

      ${section('Varasemad tegevused', historyHTML)}
    </div>`;
}

// portfolio-ui-v1
let portfolioData={users:[],clients:[]};
let portfolioSelected=new Set();
let portfolioLoaded=false;

function renderPortfolios(){
  setTimeout(loadPortfolios,0);
  return `<h2>Kliendiportfellid</h2>
    <p class="muted">Administraatori vaade · klientide ja tegevuste üleandmine</p>
    <div id="portfolioRoot" class="stack">
      <section class="panel">Laadin portfelle...</section>
    </div>`;
}

async function loadPortfolios(){
  const root=$('portfolioRoot');
  if(!root)return;
  try{
    const response=await fetch('/api/admin/portfolios',{
      credentials:'same-origin'
    });
    const data=await response.json();
    if(!response.ok)throw Error(data.error||'Laadimine ebaõnnestus.');
    portfolioData=data;
    portfolioSelected=new Set();
    portfolioLoaded=true;
    drawPortfolios();
  }catch(e){
    root.innerHTML=`<section class="panel">${esc(e.message)}</section>`;
  }
}

function portfolioOwnerOptions(){
  return portfolioData.users.map(u=>
    `<option value="${Number(u.id)}">${esc(u.name)}${u.is_active?'':' (mitteaktiivne)'}</option>`
  ).join('');
}

function drawPortfolios(){
  const root=$('portfolioRoot');
  if(!root)return;
  root.innerHTML=`
    <section class="panel">
      <h3>Vali portfell ja uus vastutaja</h3>
      <div class="form">
        <label>Praegune vastutaja</label>
        <select id="portfolioFrom" onchange="portfolioChanged()">
          ${portfolioOwnerOptions()}
        </select>
        <label>Uus vastutaja</label>
        <select id="portfolioTo">
          ${portfolioOwnerOptions()}
        </select>
        <label>Otsi klienti</label>
        <input id="portfolioSearch" placeholder="Ettevõtte nimi"
          oninput="drawPortfolioClients()">
      </div>
    </section>
    <section class="panel">
      <div class="bar">
        <h3>Kliendid</h3>
        <span id="portfolioCount" class="muted"></span>
      </div>
      <div class="bar">
        <button id="portfolioSelectAllBtn"
          type="button"
          title="Vali kõik / vabasta kõik"
          aria-label="Vali kõik või vabasta kõik"
          onclick="portfolioSelectAll()"
          style="width:24px;height:24px;padding:0;font-size:20px;margin-left:auto;margin-right:0;display:block"
          >☑</button>
      </div>
      <div id="portfolioClients"></div>
    </section>
    <section class="panel">
      <h3>Üleandmine</h3>
      <p id="portfolioSummary"></p>
      <p class="muted">
        Aktiivsed tegevused liiguvad uuele vastutajale.
        Ionprinti muudatused jäävad ootele.
      </p>
      <button class="primary" onclick="transferPortfolio()">
        Kontrolli ja kinnita üleandmine
      </button>
    </section>
    <section class="panel">
      <h3>Viimased üleandmised</h3>
      <div id="portfolioHistory">Laadin...</div>
    </section>`;
  const from=$('portfolioFrom');
  const to=$('portfolioTo');
  if(from&&to&&portfolioData.users.length>1)
    to.selectedIndex=1;
  portfolioChanged();
  loadPortfolioHistory();
}

function portfolioChanged(){
  portfolioSelected.clear();
  drawPortfolioClients();
}

function portfolioClientsForOwner(){
  const id=Number($('portfolioFrom')?.value);
  return portfolioData.clients.filter(c=>Number(c.owner_user_id)===id);
}

function drawPortfolioClients(){
  const container=$('portfolioClients');
  if(!container)return;
  const all=portfolioClientsForOwner();
  const search=($('portfolioSearch')?.value||'').toLocaleLowerCase();
  const visible=all.filter(c=>c.name.toLocaleLowerCase().includes(search));

  $('portfolioCount').textContent=all.length+' klienti';

  container.innerHTML=visible.map(c=>`
    <label style="display:grid;grid-template-columns:minmax(0,1fr) 70px 24px;gap:12px;align-items:center;width:100%;box-sizing:border-box;padding:10px 0;cursor:pointer">
      <span style="min-width:0;overflow-wrap:anywhere">${esc(c.name)}</span>
      <span class="muted" style="text-align:right">${esc(c.client_type||'')}</span>
      <input type="checkbox" ${portfolioSelected.has(Number(c.id))?'checked':''}
        style="width:18px;height:18px;margin:0;justify-self:end"
        onchange="portfolioToggle(${Number(c.id)},this.checked)">
    </label>`).join('')||'<p class="muted">Kliente ei leitud.</p>';

  $('portfolioSummary').textContent=
    'Valitud '+portfolioSelected.size+' klienti '+all.length+' kliendist.';
}

function portfolioToggle(id,checked){
  if(checked)portfolioSelected.add(id);
  else portfolioSelected.delete(id);
  drawPortfolioClients();
}

function portfolioSelectAll(){
  const all=portfolioClientsForOwner();
  const allSelected=all.length>0 &&
    all.every(c=>portfolioSelected.has(Number(c.id)));

  if(allSelected){
    portfolioSelected.clear();
  }else{
    all.forEach(c=>portfolioSelected.add(Number(c.id)));
  }
  drawPortfolioClients();
}

async function transferPortfolio(){
  const from=Number($('portfolioFrom')?.value);
  const to=Number($('portfolioTo')?.value);
  const ids=[...portfolioSelected];
  const users=portfolioData.users;
  const fromName=users.find(u=>Number(u.id)===from)?.name||'?';
  const toName=users.find(u=>Number(u.id)===to)?.name||'?';

  if(!ids.length)return alert('Vali vähemalt üks klient.');
  if(from===to)return alert('Vali teine vastutaja.');

  const message=
    `Annad ${ids.length} klienti üle:\n`+
    `${fromName} → ${toName}\n\n`+
    `Kõik nende aktiivsed tegevused liiguvad samuti üle.\n`+
    `Ionprinti sünkroonimine jääb ootele.\n\n`+
    `Kas kinnitad?`;

  if(!confirm(message))return;

  try{
    const response=await fetch('/api/admin/portfolio-transfer',{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        from_user_id:from,
        to_user_id:to,
        client_ids:ids
      })
    });
    const result=await response.json();
    if(!response.ok)throw Error(result.error||'Üleandmine ebaõnnestus.');

    alert(
      `Üle antud ${result.transferred} klienti.\n`+
      `Ümber määratud ${result.activities} aktiivset tegevust.\n`+
      `Ionprint: ootab ühendamist.`
    );
    await loadPortfolios();
  }catch(e){
    alert('Viga: '+e.message);
  }
}

async function loadPortfolioHistory(){
  const target=$('portfolioHistory');
  if(!target)return;
  try{
    const response=await fetch('/api/admin/portfolio-history',{
      credentials:'same-origin'
    });
    const result=await response.json();
    if(!response.ok)throw Error(result.error||'Viga');
    const names=id=>portfolioData.users.find(u=>Number(u.id)===Number(id))?.name||'#'+id;
    target.innerHTML=(result.history||[]).map(x=>`
      <div style="padding:9px 0">
        <b>${esc(names(x.from_user_id))} → ${esc(names(x.to_user_id))}</b>
        <div class="muted">
          ${Number(x.client_count)} klienti ·
          ${Number(x.activity_count)} tegevust ·
          ${esc(String(x.created_at||'').slice(0,19))}
        </div>
      </div>`).join('')||'<p class="muted">Üleandmisi pole veel tehtud.</p>';
  }catch(e){

ient=null;tab='activities';save();notify('Müügitegevus salvestatud ja lisatud vastutava müügimehe nimekirja.')}
function blankTemplate(){editId='new';templateDraft={name:'',type:'E-kiri',purpose:'',subject:'',body:'',next:'Kõne',days:'5',follow:true,chain:[],newPurpose:true,nextNewPurpose:true};render()}function editTemplate(i){const t=data.templates.find(x=>x.id===i);editId=i;templateDraft={...t,type:MALL_TYPES.includes(t.type)?t.type:'Kõne',purpose:t.purpose||t.name||'',follow:!!(t.nextStep||t.next),days:String(t.days||5),chain:structuredClone(t.nextStep?flattenSteps(t.nextStep).slice(1):[]),next:MALL_TYPES.includes(t.nextStep?.type||t.next)?(t.nextStep?.type||t.next):'Kõne',nextPurpose:t.nextStep?.purpose||t.nextStep?.subject||t.nextStep?.body||'Järeltegevus',nextSubject:t.nextStep?.subject||'',nextBody:t.nextStep?.body||'',newPurpose:false,nextNewPurpose:false,days:String(t.nextStep?.days||t.days||5)};render()}function renderTemplatesBase(){return `<div class="bar"><h2>Mallid</h2><button class="primary" onclick="blankTemplate()">+ Loo uus mall</button></div><div class="stack">${data.templates.map(t=>`<section class="panel"><div class="taskhead"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.type)} · Eesmärk: ${esc(t.purpose||t.name)} · ${t.next?`järgmine ${esc(t.next)} ${t.days} tööpäeva pärast`:'järgmine tegevus määramata'}</div>${t.subject?`<div class="sub">${esc(t.subject)}</div>`:''}<p class="small" style="white-space:pre-wrap">${esc(t.body)}</p></div><div class="choices"><button onclick="editTemplate('${esc(t.id)}')">Muuda</button><button onclick="deleteTemplate('${esc(t.id)}')">Kustuta</button></div></div></section>`).join('')}</div>${editId?renderTemplateForm():''}`}
function flattenSteps(step){const a=[];let n=step;while(n&&a.length<50){a.push({type:n.type,purpose:n.purpose||n.subject||n.body||'Järeltegevus',subject:n.subject||'',body:n.body||'',days:String(n.days||5)});n=n.nextStep}return a}

function allPurposeEntries(){const entries=[];for(const t of data.templates){entries.push({type:t.type,purpose:t.purpose||t.name||'',subject:t.subject||'',body:t.body||'',updatedAt:t.updatedAt||0});if(!t.nextStep&&t.next)entries.push({type:t.next,purpose:t.nextPurpose||'',subject:t.nextSubject||'',body:t.nextBody||'',updatedAt:t.updatedAt||0});let n=t.nextStep;let depth=0;while(n&&depth++<50){entries.push({type:n.type,purpose:n.purpose||'',subject:n.subject||'',body:n.body||'',updatedAt:t.updatedAt||0});n=n.nextStep}}return entries.filter(e=>e.purpose.trim())}
function purposeOptions(current){const purposes=[...new Set(allPurposeEntries().map(e=>e.purpose.trim()))].sort((a,b)=>a.localeCompare(b,'et'));if(current&&!purposes.includes(current))purposes.unshift(current);return `<option value="">Vali eesmärk</option>${purposes.map(p=>`<option value="${esc(p)}" ${p===current?'selected':''}>${esc(p)}</option>`).join('')}<option value="__new__">+ Lisa uus eesmärk…</option>`}

function budgetTotals(){const initial=data.plans.reduce((a,p)=>a+Number(p.initialAnnual||0),0);const clients=data.plans.reduce((a,p)=>a+Number(p.annual||0),0);const churn=(data.churnAdjustments||[]).reduce((a,x)=>a+x.amount,0);const current=clients+churn;const changes=[...data.budgetChanges,...(data.churnAdjustments||[]).map(x=>({...x,client:'Liitumised / loobumised',owner:'—',before:0,after:x.amount,category:'churn'}))];const up=changes.filter(c=>c.after>c.before),down=changes.filter(c=>c.after<c.before);return {initial,current,up,down,increases:up.reduce((a,c)=>a+c.after-c.before,0),decreases:down.reduce((a,c)=>a+c.before-c.after,0)}}
function applyBudgetPercent(){if(!isAdmin())return;const n=Number(budgetPercent);if(!Number.isFinite(n)||n<=0||n>100)return alert('Sisesta protsent vahemikus 0–100.');if(!data.plans.length)return alert('Kliente ei ole.');const signed=budgetDirection==='decrease'?-n:n;const changes=data.plans.map(p=>{const before=Number(p.annual),after=Math.round(before*(1+signed/100)*100)/100;return {p,before,after}});if(changes.some(x=>x.after<0))return alert('Eelarve ei tohi muutuda negatiivseks.');const reason=signed<0?prompt('Kõigi klientide eelarve vähendamise põhjendus (kohustuslik):'):'';if(signed<0&&(!reason||!reason.trim()))return alert('Muudatus tühistatud: põhjendus on kohustuslik.');if(!confirm(`Kas muuta kõigi ${changes.length} kliendi prognoosi ${signed>0?'+':''}${signed}% võrra?`))return;const date=new Date().toISOString().slice(0,10);changes.forEach(({p,before,after})=>{if(after===before)return;const ratio=before>0?after/before:1;p.annual=after;p.quarters=p.quarters.map(q=>Math.round(Number(q)*ratio*100)/100);p.quarters[3]=Math.round((after-p.quarters.slice(0,3).reduce((a,b)=>a+b,0))*100)/100;p.ackMonth=null;data.budgetChanges.push({client:p.client,actor:user,owner:p.owner,date,before,after,reason:reason||'',category:'general'});});budgetPercent='';save();notify('Kõigi klientide prognoosid uuendatud. Muudatused on detailvaates näha.');}
function applyChurnPercent(){if(!isAdmin())return;const n=Number(churnPercent);if(!Number.isFinite(n)||n<=0||n>100)return alert('Sisesta protsent vahemikus 0–100.');const base=data.plans.reduce((a,p)=>a+Number(p.annual||0),0);const amount=Math.round(base*n/100)*(churnDirection==='decrease'?-1:1);if(!amount)return alert('Arvestuslik muutus on null.');const reason=churnDirection==='decrease'?prompt('Klientide loobumise prognoosi vähendamise põhjendus (kohustuslik):'):'';if(churnDirection==='decrease'&&(!reason||!reason.trim()))return alert('Muudatus tühistatud: põhjendus on kohustuslik.');if(!confirm(`Kas lisada liitumiste/loobumiste prognoosile ${amount>0?'+':''}${money(amount)}? See ei muuda üksikklientide eelarveid.`))return;data.churnAdjustments ||= [];data.churnAdjustments.push({date:new Date().toISOString().slice(0,10),actor:user,amount,before:0,after:amount,reason:reason||'',percent:n,category:'churn'});churnPercent='';save();notify('Liitumiste/loobumiste koondprognoos uuendatud. Üksikklientide eelarved ei muutunud.');}
function renderAdminSummary(){const {initial,current,up,down,increases,decreases}=budgetTotals();const shownType=adminDetail==='up'?up:down;const names=[...new Set(shownType.map(c=>c.actor))];const shown=shownType.filter(c=>adminFilter==='all'||c.actor===adminFilter);const net=current-initial;return `<section class="panel" style="margin-top:18px"><div class="bar"><h2>Eelarve</h2><span class="muted">Näidisandmed · aasta alguse baas on fikseeritud</span></div><div class="metrics"><div class="metric" style="position:relative;padding-top:34px"><button type="button" title="Ava eelarve muutmine" aria-label="Ava eelarve muutmine" onclick="document.getElementById('budgetEditPanel').classList.toggle('hide')" style="position:absolute;top:9px;right:9px;border:1px solid #d7dce3;border-radius:7px;background:transparent;padding:4px 8px;font-size:17px;line-height:1;color:#687485;cursor:pointer">↗</button><div class="muted">Müügieelarve · aasta alguses</div><b>${money(initial)}</b><p class="small muted">Eelmise aasta kliendid ja nende mahud.</p><div id="budgetEditPanel" class="hide"><div class="form"><h3>Muuda müügieelarvet %</h3><label>Muudatuse suund</label><select onchange="budgetDirection=this.value"><option value="increase" ${budgetDirection==='increase'?'selected':''}>Suurenda</option><option value="decrease" ${budgetDirection==='decrease'?'selected':''}>Vähenda</option></select><label>Protsent (%)</label><input type="number" min="0.01" max="100" step="0.01" value="${esc(budgetPercent)}" oninput="budgetPercent=this.value" placeholder="Näiteks 5"><button class="primary" onclick="applyBudgetPercent()">Rakenda kõigile klientidele</button></div><div class="form"><h3>Liitumiste / loobumiste prognoos</h3><label>Muudatuse suund</label><select onchange="churnDirection=this.value"><option value="increase" ${churnDirection==='increase'?'selected':''}>Liitumised (+)</option><option value="decrease" ${churnDirection==='decrease'?'selected':''}>Loobumised (−)</option></select><label>Protsent klientide jooksva prognoosi summast (%)</label><input type="number" min="0.01" max="100" step="0.01" value="${esc(churnPercent)}" oninput="churnPercent=this.value" placeholder="Näiteks 3"><button class="primary" onclick="applyChurnPercent()">Lisa koondprognoosi</button></div></div></div><div class="metric"><div class="muted">Jooksev müügieelarve</div><b>${money(current)}</b><button style="display:block;margin-top:12px;width:100%;text-align:left" onclick="adminDetail=adminDetail==='up'?'none':'up';adminFilter='all';render()">Suurendamised kokku <b class="good">+${money(increases)}</b><span class="small">Vaata muudatusi</span></button><button style="display:block;margin-top:8px;width:100%;text-align:left" onclick="adminDetail=adminDetail==='down'?'none':'down';adminFilter='all';render()">Vähendamised kokku <b class="bad">−${money(decreases)}</b><span class="small">Vaata muudatusi</span></button></div><div class="metric"><div class="muted">Jooksev seis võrreldes aasta alguse eelarvega</div><b class="${net<0?'bad':'good'}">${net>0?'+':''}${money(net)}</b><div class="muted">${initial?((net/initial)*100).toFixed(1):'0.0'}% · informatiivne näitaja</div></div><div class="metric"><div class="muted">Arvestuse põhimõte</div><p class="small">Jooksev eelarve = klientide uuendatud prognoosid + liitumiste/loobumiste koondkorrektsioonid.</p><p class="small">Liitumiste ja loobumiste protsent ei muuda üksikklientide prognoose.</p></div></div>${adminDetail!=='none'?`<div class="divider"></div><h3>${adminDetail==='up'?'Eelarve suurendamised':'Eelarve vähendamised'} – detailid</h3><label>Muudatuse teinud kasutaja</label><select onchange="adminFilter=this.value;render()"><option value="all">Kõik kasutajad</option>${names.map(n=>`<option value="${esc(n)}" ${adminFilter===n?'selected':''}>${esc(n)}</option>`).join('')}</select><div style="overflow-x:auto;margin-top:12px"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Kuupäev</th><th>Klient / liik</th><th>Müügimees</th><th>Muutja</th><th>Enne</th><th>Pärast</th><th>Muutus</th><th>Põhjus</th></tr></thead><tbody>${shown.map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.client)}</td><td>${esc(c.owner||'—')}</td><td>${esc(c.actor)}</td><td>${c.category==='churn'?'—':money(c.before)}</td><td>${c.category==='churn'?'—':money(c.after)}</td><td class="${c.after<c.before?'bad':'good'}">${c.after>c.before?'+':'−'}${money(Math.abs(c.after-c.before))}</td><td>${esc(c.reason||'—')}</td></tr>`).join('')||'<tr><td colspan="8">Muudatusi veel ei ole.</td></tr>'}</tbody></table></div><p class="small muted">Liitumised / loobumised kuvatakse koondreana, sest konkreetseid kliente ei ole veel määratud.</p></div>`:''}</section>`}

async function logoutCRM(){
  try {
    const response = await fetch('/api/logout', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'}
    });
    if (!response.ok) throw new Error('Väljalogimine ebaõnnestus');
    location.replace('/');
  } catch (error) {
    alert('Väljalogimine ebaõnnestus. Proovi uuesti.');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const button = document.createElement('button');
  button.type = 'button';

  button.style.marginLeft = '12px';

  const selector = document.getElementById('user');

async function v8BudgetLoadHistory(id){

function v8BudgetRender(){const d=v8BudgetDraft,el=$('clientBudgetEdit');if(!d||!el)return;el.innerHTML=`<div class="form"><h3>Muuda jooksvat eelarvet</h3><label>Sisestusviis</label><select onchange="v8BudgetMode(this.value)"><option value="annual" ${d.mode==='annual'?'selected':''}>Aastaeelarve</option><option value="quarterly" ${d.mode==='quarterly'?'selected':''}>Kvartalite kaupa</option></select>${d.mode==='annual'?`<label>Aastaeelarve (€)</label><input type="number" min="0" step="0.01" value="${esc(d.annual)}" oninput="v8BudgetDraft.annual=this.value">`:['I kvartal','II kvartal','III kvartal','IV kvartal'].map((label,i)=>`<label>${label} (€)</label><input type="number" min="0" step="0.01" value="${esc(d.quarters[i])}" oninput="v8BudgetDraft.quarters[${i}]=this.value">`).join('')}<div class="choices"><button class="primary" onclick="v8BudgetSave()">Salvesta</button><button onclick="v8BudgetDraft=null;$('clientBudgetEdit').innerHTML=''">Tühista</button></div><p class="small muted">Muudetakse ainult jooksvat eelarvet. Aasta alguse eelarvet ei muudeta.</p></div>`;}
function v8BudgetMode(mode){const d=v8BudgetDraft;if(!d)return;if(mode==='quarterly'&&d.mode==='annual'){const n=Number(d.annual)||0;const cents=Math.round(n*100),base=Math.floor(cents/4);d.quarters=[base,base,base,cents-base*3].map(v=>String(v/100));}if(mode==='annual'&&d.mode==='quarterly')d.annual=String(d.quarters.reduce((s,x)=>s+(Number(x)||0),0));d.mode=mode;v8BudgetRender();}
async function v8BudgetSave(){const d=v8BudgetDraft;if(!d)return;const total=d.mode==='annual'?Number(d.annual):d.quarters.reduce((s,x)=>s+Number(x),0);if(!Number.isFinite(total)||total<0)return alert('Sisesta korrektne eelarve.');let reason='';if(total<Number(d.original)){reason=prompt('Eelarve vähendamise põhjendus (kohustuslik):')||'';if(reason.trim().length<5)return alert('Eelarve vähendamine tühistati.');}try{await v8Api('/clients/'+d.id+'/budget',{method:'PUT',body:JSON.stringify({mode:d.mode,annual:d.annual,quarters:d.quarters,reason})});const id=d.id;v8BudgetDraft=null;await v8BudgetPreview(id);}catch(e){alert(e.message)}}

 const q=crmQueues.queues[lane],busy=v8Pending||!!v8Active||!!v8Action||!!v8Stop;
 const cards=[['today','activities'],['overdue','overdue']].map(([key,t])=>{
  const item=crmQueues.queues[key];return `<button class="card ${tab===t?'active':''}" onclick="switchTab('${t}')">${esc(item.title)}<strong>${item.shown}/${item.total}</strong><span class="muted">Näidatud / järjekorras kokku</span></button>`;
 }).join('')+`<button class="card ${tab==='warnings'?'active':''}" onclick="switchTab('warnings')">Käibehoiatused<strong>Ootel</strong><span class="muted">Vajab Ionprindi ühendust</span></button>`;
 const header=`<h2>Töölaud · ${esc(crmQueues.work_date)}</h2><div class="cards">${cards}</div>`;
 const replies=alerts?`<h2>Klientide vastused · ${crmReplyAlerts.length}</h2><div class="stack">${alerts}</div>`:'';
 if(tab==='warnings')return header+'<section class="panel"><h3>Käibehoiatused</h3><p class="muted">See koht on reserveeritud käibelangusega klientide tegevustele. Hoiatused lisanduvad pärast Ionprindi andmeühenduse valmimist.</p></section>'+replies;
 const tasks=q.items.map(crmTask);
 const waiting=crmQueues.unplanned;
 const fill=lane==='today'?`<div class="divider"></div><p class="muted">${waiting.total} varem suheldud avatud klienti ootab järgmise tegevuse planeerimist.</p>${!crmQueues.read_only&&waiting.can_fill?`<label for="crmQueueTemplate">Tegevusmall vabade kohtade täitmiseks</label><select id="crmQueueTemplate" ${busy||!waiting.can_fill?'disabled':''} onchange="crmQueueTemplate=this.value"><option value="">Vali tegevusmall</option>${data.templates.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(crmQueueTemplate)?'selected':''}>${esc(t.type)} · ${esc(t.purpose||t.name)}</option>`).join('')}</select><p class="small muted">Kuupäevaga tegevused on eespool. Valik lisab kuni ${waiting.slots} tegevust tänasesse plaani; kirju automaatselt ei saadeta.</p><button class="primary" ${busy||!waiting.can_fill?'disabled':''} onclick="crmQueueNext('today',true)">Täida vabad kohad klientidega</button>`:''}`:'';
 const navigation=crmQueues.read_only?`<div class="choices"><button ${q.page===0||busy?'disabled':''} onclick="crmQueuePage('${lane}',-1)">Eelmised</button><button ${!q.has_next||busy?'disabled':''} onclick="crmQueuePage('${lane}',1)">Järgmised</button></div>`:
  `<button class="primary" ${!q.can_next||busy?'disabled':''} onclick="crmQueueNext('${lane}')">Võta järgmised</button>`;
 const explanation=crmQueues.read_only?'Administraatori ülevaade kõigi töötajate järjekordadest. Päevaplaani valimiseks kasuta tavakasutaja režiimi.':`Selles valikus ${q.selected} tegevust; praegu kuvatud ${q.shown}. Lõpetatud või edasi lükatud tegevuste asemele uusi automaatselt ei lisata.`;
 return `${header}<section class="panel"><h3>${esc(q.title)} · ${q.shown}/${q.total}</h3><p class="muted">${esc(explanation)}</p><p class="small muted">Veel kuvamata: ${q.waiting}</p>${navigation}${fill}</section>${renderTasks(tasks)}${!q.items.length?'<p class="muted">Selles valikus praegu tegevusi ei ole.</p>':''}${replies}`;
}
async function crmQueueNext(lane,fill=false){
 if(v8Pending||v8Active||v8Action||v8Stop||!crmQueues)return;
 if(fill?!crmQueues.unplanned.can_fill:!crmQueues.queues[lane]?.can_next)return;
 if(fill&&!crmQueueTemplate)return alert('Vali tegevusmall.');
 const body={action:fill?'fill':'next',lane,version:crmQueues.version,work_date:crmQueues.work_date};
 if(fill)body.template_id=Number(crmQueueTemplate);
 v8Pending=true;render();
 try{await v8Api('/v8/work-queues/select',{method:'POST',body:JSON.stringify(body)});await v8ReloadTasks();}
 catch(e){alert(e.message);try{await v8ReloadTasks();}catch{notice='Päevaplaani laadimine ebaõnnestus. Värskenda lehte.';}}
 finally{v8Pending=false;render();}
}
async function crmQueuePage(lane,change){
 if(v8Pending||!crmQueues?.read_only)return;
 crmQueuePages[lane]=Math.max(0,(crmQueuePages[lane]||0)+change);
 try{await v8ReloadTasks();render();}catch(e){alert(e.message);}
}

function renderTasks(list){return list.length?`<div class="stack">${list.map(t=>`<section class="panel"><div class="taskhead"><div><b>${esc(t.client)}</b><div>${esc(t.type)} · ${esc(t.purpose||'Eesmärk määramata')}</div><div class="muted">${esc(t.due)} · ${esc(t.owner)}</div></div>${Number(t.ownerId)===Number(crmRealMe?.id)?`<button class="primary" onclick="v8OpenTask(${Number(t.id)})">Ava tegevus</button>`:`<button onclick="crmOpenReplyClient(${Number(t.clientId)})">Vaata kliendikaarti</button><span class="muted">Ainult vaatamine</span>`}</div></section>`).join('')}</div>`:'';}
async function v8ReloadTasks(){
 const request=++crmQueueLoad;
 const params=crmRealMe?.role==='admin'?'?'+new URLSearchParams(Object.fromEntries(Object.entries(crmQueuePages).map(([lane,page])=>[lane+'_page',String(page)]))):'';
 const [x,result]=await Promise.all([v8Api('/v8/activities'),v8Api('/v8/work-queues'+params)]);
 let queues=result;
 if(!queues.read_only&&!queues.initialized)queues=await v8Api('/v8/work-queues/select',{method:'POST',body:JSON.stringify({action:'initialize'})});
 if(request!==crmQueueLoad)return;
 data.tasks=x.activities.map(crmTask);crmQueues=queues;
}
async function crmRefresh(){
 const results=await Promise.allSettled([v8ReloadTasks(),crmLoadReplyAlerts(false)]);
 if(crmSelectedClient&&page==='clients')await openClientById(crmSelectedClient);else render();
 if(results[0].status==='rejected') {notice='Salvestatud, kuid nimekirja värskendamine ebaõnnestus. Laadi leht uuesti.';render();}
}
function crmScrollForm(){setTimeout(()=>$('crmWorkflow')?.scrollIntoView({behavior:'smooth',block:'start'}),0);}
function v8OpenTask(id){
 if(v8Pending)return;
 const t=data.tasks.find(x=>x.id===id)||(crmClientResult?.activities||[]).map(crmTask).find(x=>x.id===id);if(!t||Number(t.ownerId)!==Number(crmRealMe?.id))return;
 crmMailDraft=null;v8Action=null;v8Stop=null;crmReplyReview=null;
 const next=v8Choice(t.nextStep?.type||'Kõne');
 if(t.nextStep){const match=data.templates.find(x=>x.type===next.type&&(x.purpose||x.name)===t.nextStep.purpose);if(match)v8SelectTemplate(next,match.id);next.due=v8AddBusinessDays(v8Today(),Number(t.nextStep.days)||5);}
 v8Active={id,task:t,phase:'work',comment:'',outcome:t.type==='Kohtumine'?'':'done',nextMode:'default',next,reason:'',other:'',postponeOpen:false,postponeDate:'',replyIds:crmReplyIds(t.clientId)};render();crmScrollForm();
 if(t.type==='E-kiri')crmOpenMail(id);
}
function v8SetOutcome(value){if(v8Active?.phase==='work'&&!v8Pending){v8Active.outcome=value;render();}}
function v8SetNextMode(value){if(v8Active?.phase==='completed'&&!v8Pending){v8Active.nextMode=value;render();}}
function v8SetStopReason(value){if(v8Active){v8Active.reason=value;render();}}
function crmCloseWorkflow(){if(v8Pending)return;v8Active=null;v8Action=null;v8Stop=null;crmMailDraft=null;crmReplyReview=null;render();}
function crmPostponeToggle(){if(v8Active?.phase==='work'&&!v8Pending){v8Active.postponeOpen=!v8Active.postponeOpen;render();}}
async function crmPostponeCurrent(){
 const s=v8Active;if(!s||v8Pending||s.phase!=='work')return;
 if(!s.postponeDate||s.postponeDate<=v8Today()||s.postponeDate<=s.task.due)return alert('Vali tänasest ja senisest tähtajast hilisem kuupäev.');
 try{v8Pending=true;render();await v8Api('/v8/activities/'+s.id+'/resolve',{method:'POST',body:JSON.stringify({action:'postpone',new_date:s.postponeDate})});v8Active=null;crmMailDraft=null;await crmRefresh();}
 catch(e){alert(e.message)}finally{v8Pending=false;render();}
}
async function v8ResolveTask(){
 const s=v8Active;if(!s||v8Pending)return;
 const completing=s.phase==='work';
 if(completing&&s.task.type==='E-kiri')return alert('Saada kiri saatmisvormist.');
 if(completing&&(!s.comment.trim()||(s.task.type==='Kohtumine'&&(!s.outcome||s.comment.trim().length<5))))return alert('Kirjuta tegevuse tulemus ja vali kohtumise korral tulemus.');
 if(!completing&&s.nextMode==='default'){crmCloseWorkflow();return;}
 if(!completing&&s.nextMode==='stop'&&!confirm('Kas lõpetada kliendi jälgimine?'))return;
 try{
  v8Pending=true;render();
  const result=await v8Api('/v8/activities/'+s.id+(completing?'/resolve':'/next-step'),{method:'POST',body:JSON.stringify(completing?{action:'complete',outcome:s.outcome,comment:s.comment,reply_ids:s.replyIds}:{next:s.nextMode,reason_id:Number(s.reason),reason_other:s.other,planned:crmPlanned(s.next)})});
  if(completing){s.phase='completed';s.completion=result;s.nextMode='default';}else{v8Active=null;crmMailDraft=null;}
  await crmRefresh();
 }catch(e){alert(e.message)}finally{v8Pending=false;render();}
}
const crmPlanned=a=>({type:a.type,due_date:a.due,template_id:a.templateId?Number(a.templateId):null,purpose:a.purpose,subject:a.subject,instructions:a.instructions});
function crmNextHTML(s){return `<p class="good" role="status">Tegevus on lõpetatud ja tulemus ajalukku salvestatud. Vaikimisi järeltegevus: ${esc(s.completion?.due_date||'14 päeva pärast')}.</p><h3>Järgmine samm</h3><div class="choices"><button onclick="v8SetNextMode('plan')">Planeeri järgmine tegevus</button><button onclick="v8SetNextMode('stop')">Lõpeta jälgimine</button></div>${s.nextMode==='plan'?v8PlannerFields(s.next,'next'):s.nextMode==='stop'?`<label>Lõpetamise põhjus</label>${v8ReasonSelect(s.reason,'v8SetStopReason(this.value)')}${v8IsOther(s.reason)?`<label>Täpsustus</label><textarea oninput="v8Active.other=this.value">${esc(s.other)}</textarea>`:''}`:'<p class="muted">Kui järgmist sammu ei vali või sulged vormi, jääb kehtima 14-päevane ooteaeg.</p>'}<button class="primary" onclick="v8ResolveTask()">${s.nextMode==='default'?'Jäta 14 päevaks ootele':s.nextMode==='stop'?'Kinnita lõpetamine':'Salvesta järgmine tegevus'}</button>`;}
function v8RenderTaskForm(t){
 const s=v8Active;if(!s)return '';
 if(s.phase==='completed')return crmNextHTML(s);
 if(s.postponeOpen)return `<h3>${t.type==='E-kiri'?'Planeeri kiri hiljem':'Tegevuse edasilükkamine'}</h3><label>Uus kuupäev</label><input type="date" min="${v8Today()}" value="${esc(s.postponeDate)}" onchange="v8Active.postponeDate=this.value"><button class="primary" onclick="crmPostponeCurrent()">Salvesta uus kuupäev</button><button onclick="crmPostponeToggle()">Tagasi tegevuse juurde</button>`;
 if(t.type==='E-kiri')return `${crmMailDraft?.id===t.id?crmMailForm(t):'<p class="muted">Laadin saatmisvormi…</p><button onclick="crmOpenMail('+t.id+')">Laadi saatmisolek uuesti</button>'}${!crmMailDraft?.sent&&!crmMailDraft?.blocked?'<button onclick="crmPostponeToggle()">Planeeri hiljem</button>':''}`;
 return `${t.instructions?`<label>Tegevuse juhis</label><p style="white-space:pre-wrap">${esc(t.instructions)}</p>`:''}${t.type==='Kohtumine'?`<label>Kohtumise tulemus</label><select onchange="v8SetOutcome(this.value)"><option value="">Vali tulemus</option><option value="done" ${s.outcome==='done'?'selected':''}>Toimus</option><option value="cancelled" ${s.outcome==='cancelled'?'selected':''}>Jäi ära</option></select>`:''}<label>${t.type==='Kõne'?'Kõne tulemuse kommentaar':'Kohtumise tulemuse kommentaar'}</label><textarea rows="4" maxlength="5000" oninput="v8Active.comment=this.value">${esc(s.comment)}</textarea><button class="primary" onclick="v8ResolveTask()">Tehtud</button><button onclick="crmPostponeToggle()">Lükka tegevus edasi</button>`;
}
function crmWorkflowHTML(){
 if(!v8Active&&!v8Action&&!v8Stop&&!crmReplyReview)return '';
 const title=v8Active?v8Active.task.type+' · '+v8Active.task.client:v8Action?'Uus '+v8Action.type:v8Stop?'Lõpeta jälgimine':'Kliendi vastuse käsitlemine';
 const body=v8Active?v8RenderTaskForm(v8Active.task):v8Action?v8RenderAction():v8Stop?v8RenderClientStop():`<label>Käsitlemise tulemus / kokkulepe</label><textarea maxlength="5000" oninput="crmReplyReview.note=this.value">${esc(crmReplyReview.note)}</textarea><button class="primary" onclick="crmHandleReply()">Salvesta käsitlemise tulemus</button>`;
 return `<section class="panel" id="crmWorkflow" style="margin-top:18px;border:2px solid #1f4d93"><div class="bar"><h3>${esc(title)}</h3><button ${v8Pending?'disabled':''} onclick="crmCloseWorkflow()">Sulge</button></div><fieldset ${v8Pending?'disabled':''} style="border:0;padding:0;margin:0;min-width:0"><div class="form">${body}</div></fieldset>${v8Pending?'<p role="status">Salvestan…</p>':''}</section>`;
}
function showClientAction(id,type){if(v8Pending)return;v8Active=null;v8Stop=null;crmReplyReview=null;crmMailDraft=null;v8Action={...v8Choice(type),clientId:Number(id),replyIds:crmReplyIds(id)};render();crmScrollForm();}
function v8RenderAction(){return `${v8PlannerFields(v8Action,'client')}<div class="choices"><button class="primary" onclick="v8SaveClientAction('open')">${v8Action.type==='E-kiri'?'Ava kirja koostamine':'Ava tegevus'}</button><button onclick="v8SaveClientAction('schedule')">Salvesta planeering</button></div><p class="muted">Planeerimine ei lõpeta tegevust ega suurenda järeltegevuste loendurit.</p>`;}
async function v8SaveClientAction(mode){
 const a=v8Action;if(!a||v8Pending)return;
 try{v8Pending=true;render();const x=await v8Api('/v8/activities',{method:'POST',body:JSON.stringify({client_id:a.clientId,...crmPlanned(a),reply_ids:mode==='schedule'?a.replyIds:[]})});v8Action=null;await crmRefresh();v8Pending=false;
 if(mode==='open'){v8OpenTask(Number(x.id));if(v8Active)v8Active.replyIds=a.replyIds;}
 }catch(e){alert(e.message)}finally{v8Pending=false;render();}
}
function showClientStop(id){if(v8Pending)return;v8Active=null;v8Action=null;crmReplyReview=null;crmMailDraft=null;v8Stop={clientId:Number(id),reason:'',other:'',replyIds:crmReplyIds(id)};render();crmScrollForm();}
function v8RenderClientStop(){const s=v8Stop;return `<p class="muted">Aktiivsed tegevused peatatakse. Klient ja ajalugu säilivad.</p><label>Põhjus</label>${v8ReasonSelect(s.reason,'v8Stop.reason=this.value;render()')}${v8IsOther(s.reason)?`<label>Täpsustus</label><textarea oninput="v8Stop.other=this.value">${esc(s.other)}</textarea>`:''}<button class="primary" onclick="v8SaveClientStop()">Kinnita lõpetamine</button>`;}
async function v8SaveClientStop(){
 const s=v8Stop,r=v8Reasons.find(r=>String(r.id)===String(s?.reason));if(!s||v8Pending)return;if(!r||(v8IsOther(s.reason)&&s.other.trim().length<5))return alert('Vali põhjus ja vajadusel täpsusta.');
 if(!confirm('Kas lõpetada kliendi aktiivne jälgimine?'))return;
 try{v8Pending=true;render();await v8Api('/clients/'+s.clientId+'/stop-monitoring',{method:'POST',body:JSON.stringify({reason:r.label+(v8IsOther(s.reason)?': '+s.other.trim():''),reply_ids:s.replyIds})});v8Stop=null;await crmRefresh();}catch(e){alert(e.message)}finally{v8Pending=false;render();}
}
async function crmOpenMail(id){
 const state=v8Active;if(!state||v8Pending)return;
 try{
 const x=await v8Api('/mail/activity/'+id);if(v8Active!==state)return;
 if(x.send?.status==='sent'){
  const result=await v8Api('/v8/activities/'+id+'/resolve',{method:'POST',body:JSON.stringify({action:'complete',reply_ids:state.replyIds})});
  if(v8Active!==state)return;state.phase='completed';state.completion=result;await crmRefresh();return;
 }
 if(x.send){crmMailDraft={id,blocked:true,status:x.send.status};render();return;}
 if(!x.configured)throw Error('Sinu CRM-i postkast pole seadistatud. Kirja saab eraldi hilisemaks planeerida.');
 if(!x.contacts.length)throw Error('Kliendil puudub e-posti aadressiga kontaktisik.');
 const c=x.contacts.find(c=>String(c.id)===String(x.activity.contact_id))||x.contacts[0];
 crmMailDraft={id,contacts:x.contacts,contactId:c.id,recipient:c.email,templateId:String(x.activity.template_id||''),subject:x.activity.subject||'',body:x.activity.instructions||'',sent:false};render();
 }catch(e){alert(e.message)}
}
function crmMailChoosePurpose(value){const d=crmMailDraft;if(!d||v8Pending)return;const t=v8Template(value,'E-kiri');d.templateId=t?String(t.id):'';d.subject=t?.subject||'';d.body=t?.body||'';render();}
function crmMailForm(t){const d=crmMailDraft;if(d.blocked)return `<p class="bad">Saatmine on registreeritud olekuga „${esc(d.status)}”. Uut saatmist ei tehta. Palu administraatoril saatmist kontrollida.</p>`;
 return `<label>Kontaktisik</label><select onchange="crmMailDraft.contactId=Number(this.value);crmMailDraft.recipient=crmMailDraft.contacts.find(c=>Number(c.id)===Number(this.value)).email;render()">${d.contacts.map(c=>`<option value="${Number(c.id)}" ${Number(c.id)===Number(d.contactId)?'selected':''}>${esc(c.name)} · ${esc(c.email)}</option>`).join('')}</select><label>Saaja e-posti aadress</label><input id="crmMailRecipient" type="email" value="${esc(d.recipient)}" oninput="crmMailDraft.recipient=this.value"><p class="muted">Aadressi muutmine kehtib ainult sellele kirjale.</p><label>Eesmärk</label><select onchange="crmMailChoosePurpose(this.value)">${v8Options('E-kiri',d.templateId)}</select><label>Kirja pealkiri</label><input maxlength="500" id="crmMailSubject" value="${esc(d.subject)}" oninput="crmMailDraft.subject=this.value"><label>Kirja sisu</label><textarea maxlength="10000" id="crmMailBody" rows="9" oninput="crmMailDraft.body=this.value">${esc(d.body)}</textarea><button class="primary" onclick="crmSendMail(${Number(t.id)})">Saada kiri</button>`;
}
async function crmSendMail(id){
 const d=crmMailDraft,s=v8Active;if(!d||!s||d.id!==id||d.blocked||v8Pending||s.phase!=='work')return;
 const tpl=v8Template(d.templateId,'E-kiri');if(!tpl||!d.subject.trim()||!d.body.trim()||!/^[^\s@<>;,]+@[^\s@<>;,]+\.[^\s@<>;,]+$/.test(d.recipient.trim()))return alert('Vali eesmärk ning täida korrektne saaja, pealkiri ja sisu.');
 if(!confirm('Kas saata kiri aadressile '+d.recipient.trim()+'?'))return;
 try{v8Pending=true;render();const x=await v8Api('/mail/activity/'+id+'/send',{method:'POST',body:JSON.stringify({contact_id:Number(d.contactId),recipient:d.recipient.trim(),template_id:Number(d.templateId),purpose:tpl.purpose||tpl.name,subject:d.subject,body:d.body,reply_ids:s.replyIds})});d.sent=true;s.phase='completed';s.completion=x.completion;s.nextMode='default';await crmRefresh();}
 catch(e){d.blocked=true;d.status='kontrolli saatmisolekut';alert(e.message)}finally{v8Pending=false;render();}
}
async function crmLoadReplyAlerts(redraw=true){
 if(crmReplyLoading)return;crmReplyLoading=true;
 try{const x=await v8Api('/mail/reply-alerts');const changed=JSON.stringify(x.alerts)!==JSON.stringify(crmReplyAlerts);crmReplyAlerts=x.alerts||[];if(redraw&&changed&&page==='dashboard')render();}
 catch(e){console.warn('Vastuste laadimine:',e.message)}finally{crmReplyLoading=false;}
}
function crmReviewReply(id,clientId){if(v8Pending)return;v8Active=null;v8Action=null;v8Stop=null;crmReplyReview={id,clientId,note:''};render();crmScrollForm();}
async function crmHandleReply(){const d=crmReplyReview;if(!d||v8Pending)return;if(d.note.trim().length<5)return alert('Kirjuta vastuse käsitlemise tulemus (vähemalt 5 märki).');
 try{v8Pending=true;render();await v8Api('/mail/reply-alerts/'+d.id+'/handled',{method:'POST',body:JSON.stringify({note:d.note})});crmReplyReview=null;await crmRefresh();}catch(e){alert(e.message)}finally{v8Pending=false;render();}}
async function crmOpenReplyClient(id){go('clients');return openClientById(Number(id));}
async function crmReplyPlan(id){await crmOpenReplyClient(id);if(crmClientResult)showClientAction(Number(id),'Kõne');}
async function crmReplyStop(id){await crmOpenReplyClient(id);if(crmClientResult)showClientStop(Number(id));}
async function startCRM(){
 try{const x=await v8Api('/me');crmRealMe=x.user;if(!crmRealMe?.name){location.replace('/');return;}
 user=crmRealMe.name;data.users=[{name:user,role:crmRealMe.role,active:true}];data.tasks=[];data.plans=[];data.stopped={};
 $('user').disabled=true;$('crmModeControl').hidden=crmRealMe.accountRole!=='admin';$('crmWorkMode').value=crmRealMe.mode;await v8ReloadConfig();await v8ReloadTasks();await crmLoadReplyAlerts(false);crmReady=true;render();
 }catch(e){$('app').textContent='CRM-i laadimine ebaõnnestus: '+e.message;}
}
async function crmRefreshQueuesIfIdle(){
 if(!crmReady||page!=='dashboard'||v8Pending||v8Active||v8Action||v8Stop)return;
 try{await v8ReloadTasks();if(!v8Active&&!v8Action&&!v8Stop&&!v8Pending)render();}catch{notice='Tööjärjekorra värskendamine ebaõnnestus.';render();}
}
setInterval(()=>{crmLoadReplyAlerts();crmRefreshQueuesIfIdle();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){crmLoadReplyAlerts();crmRefreshQueuesIfIdle();}});
startCRM();
</script></body></html>
